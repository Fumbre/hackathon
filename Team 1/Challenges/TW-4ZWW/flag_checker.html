<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Checker</title>
<style>
  :root { --bg:#0f1720; --card:#17212d; --fg:#e6edf3; --muted:#8b98a5; --ok:#3fb950; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .muted { color:var(--muted); }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-top:20px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 260px; padding:12px; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:var(--fg); font:16px ui-monospace, Consolas, monospace; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--acc); color:#04121f; font-weight:600; cursor:pointer; }
  #result { margin-top:14px; font-weight:600; min-height:24px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul { padding-left:18px; } code { background:#0d1117; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>Flag Checker</h1>
  <div class="muted">Team <code>TW-4ZWW</code> &middot; works offline &middot; checks against your team's flags only</div>
  <div class="card">
    <form id="f">
      <input id="flag" placeholder="TW{...}" autocomplete="off" spellcheck="false">
      <button type="submit">Check</button>
    </form>
    <div id="result"></div>
  </div>
  <div class="card">
    <b>Found this session</b> <span class="muted">(only in this browser; still write every flag in answers.txt!)</span>
    <ul id="found"></ul>
  </div>
</main>
<script>
const TEAM = "TW-4ZWW", ITER = 20000, ENTRIES = {"01": {"name": "Needle in a Haystack", "h": "52a6634957bf8b7fbc55e9d19cf48d23c2eb29e63fbf9b1a0304466d744c728a"}, "02": {"name": "Layers", "h": "f37de531fa60d29940d588e58e9d2a99638de46d417181b1f9d635e207dcd80f"}, "03": {"name": "View Source", "h": "f0a51e6c84eae3c4c5e85969584b0f1cd2b00b68501e7cc5514459a03f1edefc"}, "04": {"name": "Photo Secret", "h": "006bf6e3d3a743693ee1cb7635885f0ce1bd8155d8e82f401ca54da3e94381e1"}, "05": {"name": "Wrong Extension", "h": "fb869ddc30bcb0856ecc2dc88165cae4ce6e996a76e9ff225d6841f33fc5b549"}, "06": {"name": "Office Secrets", "h": "2c32f7c8fa680ec29daed2b34c6e29cfa6e4ec0e4d4647d8f45efb11038b299f"}, "07": {"name": "Admin Panel", "h": "d048b0fbb7535fe863e327a9e8439fc042c9f3fc8187c8cf5b567fb3100bc437"}, "08": {"name": "Heavy Photo", "h": "135224154750cf3d4642aadceac35ef497c1b9e3308a142d39bc7b7dcaece679"}, "09": {"name": "Sensor Log", "h": "ddddf9c0b99635bd45652280f83ed13269d6cf6b989c47caa0c6722a6c42d79e"}, "10": {"name": "Old Database", "h": "b4c78d3db8bdfb6655f6a99ce18dff8fae5f362fa0cb01ab50c34ce820e3a21e"}, "11": {"name": "Suspicious Mail", "h": "9778dc5b628b784f086fe65e38c0d1a9147debe65acca3d20f41c91b153a057a"}, "12": {"name": "Network Capture", "h": "ef98a11536ad3ca1f9508bb2670bce0340c258a304efd710846523a2d02fd209"}, "13": {"name": "Broken QR", "h": "1fec3588059b45d38859f2937c7dd5104a22f35969d4d9f4072918ca391c816e"}, "14": {"name": "Sound Picture", "h": "72348d4f8daa9263711d3a251db2442c1b57557351e1a613da6f2628d968060f"}, "15": {"name": "Vault Program", "h": "7c6e0a3297fcf44c31bc18b2cbf46103aa8f7c1a7aeebe614d9717061cc702f8"}, "16": {"name": "Repeating Key", "h": "f328a17420766bec710dcf5c1c51c5fa6e7df4d33ab7de4b689ad26670d34fa6"}, "17": {"name": "Deleted Branch", "h": "05c0cfb0e6481d2cc806881e9f489be00193912bc91db73e4f303d7ed9d20202"}, "18": {"name": "Lazy Randomness", "h": "deceb1f23b57fbe5cea6907426af8c97a60c123d67dc630bd76771788dc54c5a"}, "19": {"name": "Russian Doll", "h": "f321e5088c8d3e807deab3b66f431b86bab448cfa3839332d4b00091f9c857f7"}, "20": {"name": "Tiny Machine", "h": "9b717f1c262531a30917c9c639060c579ebc178e67cf74c9b26c15156332f100"}};
const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,
0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,
0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,
0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l = bytes.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296));
  const W = new Uint32Array(64);
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const x = W[i - 15], y = W[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
  return out;
}
function normalize(s) {
  s = s.trim().replace(/^["']|["']$/g, "").trim().toLowerCase();
  if (!s.startsWith("tw{")) s = "tw{" + s.replace(/^\{+|\}+$/g, "") + "}";
  return s;
}
function check(flag) {
  let h = sha256(new TextEncoder().encode(TEAM + "|" + normalize(flag)));
  for (let i = 1; i < ITER; i++) h = sha256(h);
  const hex = Array.from(h, b => b.toString(16).padStart(2, "0")).join("");
  for (const [id, e] of Object.entries(ENTRIES)) if (e.h === hex) return id;
  return null;
}
const found = new Set();
function showFound() {
  document.getElementById("found").innerHTML = [...found].sort().map(id =>
    "<li>" + id + " - " + ENTRIES[id].name + "</li>").join("") || "<li class='muted'>nothing yet</li>";
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const r = document.getElementById("result"), v = document.getElementById("flag").value;
  if (!v.trim()) return;
  r.className = ""; r.textContent = "Checking...";
  setTimeout(() => {
    const id = check(v);
    if (id) { r.className = "ok"; r.textContent = "Correct! That is the flag for challenge " + id + " - " + ENTRIES[id].name; found.add(id); showFound(); }
    else { r.className = "bad"; r.textContent = "Not a flag for your team. Check for typos (or keep hacking)."; }
  }, 20);
});
showFound();
</script>
</body>
</html>
