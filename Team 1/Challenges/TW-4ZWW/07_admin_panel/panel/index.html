<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunebed Hosting - Staff Panel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #eef0ec; color: #1d232b; }
  header { background: #2f3b2f; color: #fff; padding: 14px 24px; font-weight: 700; }
  header span { color: #c9b27c; }
  main { max-width: 640px; margin: 32px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 8px #0001; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #c8ccc4; border-radius: 8px; font: 15px ui-monospace, Consolas, monospace; }
  textarea { height: 80px; resize: vertical; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #2f3b2f; color: #fff; font-weight: 600; cursor: pointer; }
  .err { color: #b42318; font-weight: 600; } .ok { color: #1a7f37; font-weight: 700; }
  .locked { background: #fff4f2; border: 1px dashed #b42318; } .open { background: #effaf1; border: 1px solid #1a7f37; }
  .hidden { display: none; } small { color: #667; }
</style>
</head>
<body>
<header>Hunebed<span>Hosting</span> &middot; Staff Panel</header>
<main>
  <div class="card" id="login">
    <h2>Sign in</h2>
    <form id="lf">
      <label for="u">Username</label><input id="u" autocomplete="off">
      <label for="p">Password</label><input id="p" type="password">
      <button>Sign in</button>
    </form>
    <p id="lmsg"></p>
  </div>
  <div class="hidden" id="dash">
    <div class="card"><h2 id="hello"></h2><p>Role: <b id="role"></b></p>
      <p>Open tickets: 3 &middot; Servers online: 41/41 &middot; Coffee level: low</p></div>
    <div class="card locked" id="admin"><h3>Admin area</h3><p id="amsg">Locked. Only accounts with role <b>admin</b> can see this.</p></div>
    <div class="card">
      <h3>Session token</h3>
      <small>Debug panel (TODO: remove before release). Paste a token to restore a session.</small>
      <textarea id="tok" spellcheck="false"></textarea>
      <button id="use">Use token</button> <span id="tmsg"></span>
    </div>
  </div>
</main>
<script>
// Small SHA-256 (works on file:// pages where crypto.subtle is missing)
const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,
0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,
0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,
0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,
0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l = bytes.length, nb = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(nb);
  m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor(l * 8 / 4294967296));
  const W = new Uint32Array(64);
  for (let o = 0; o < nb; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) {
      const x = W[i - 15], y = W[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  const out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (let i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
  return out;
}

const SALT = "c9f17fc21023be95";
const SECRET = "+AoIGUGseq4IVsBVA3ega5h2ICPlOAHRcqhq2ekZ1CMc";
function b64decode(s) {
  s = s.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
}
function b64encode(s) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(s)));
}
function unlock(role) {
  const enc = new TextEncoder(), data = Uint8Array.from(atob(SECRET), c => c.charCodeAt(0));
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i += 32) {
    const ks = sha256(enc.encode("panel|" + role + "|" + SALT + "|" + (i / 32)));
    for (let j = 0; j < 32 && i + j < data.length; j++) out[i + j] = data[i + j] ^ ks[j];
  }
  return new TextDecoder().decode(out);
}
function load(token) {
  let s;
  try { s = JSON.parse(b64decode(token)); } catch (e) { return "That is not a valid session token."; }
  if (!s || typeof s.user !== "string" || typeof s.role !== "string") return "Session is missing user or role.";
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dash").classList.remove("hidden");
  document.getElementById("hello").textContent = "Welcome, " + s.user + "!";
  document.getElementById("role").textContent = s.role;
  document.getElementById("tok").value = token.trim();
  const a = document.getElementById("admin"), m = document.getElementById("amsg");
  if (s.role.trim().toLowerCase() === "admin") {
    a.className = "card open";
    m.innerHTML = "<span class='ok'>Access granted.</span> Backup server master key: <code></code>";
    m.querySelector("code").textContent = unlock("admin");
  } else {
    a.className = "card locked";
    m.innerHTML = "Locked. Only accounts with role <b>admin</b> can see this.";
  }
  return "";
}
document.getElementById("lf").addEventListener("submit", ev => {
  ev.preventDefault();
  const u = document.getElementById("u").value.trim(), p = document.getElementById("p").value;
  const msg = document.getElementById("lmsg");
  if (u === "guest" && p === "guest") {
    msg.textContent = "";
    load(b64encode(JSON.stringify({user: "guest", role: "user", login: "2026-11-13T09:11"})));
  } else {
    msg.className = "err"; msg.textContent = "Wrong username or password.";
  }
});
document.getElementById("use").addEventListener("click", () => {
  const t = document.getElementById("tmsg"), err = load(document.getElementById("tok").value);
  t.className = err ? "err" : "ok"; t.textContent = err || "Session loaded.";
});
</script>
</body>
</html>
